<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><title>Porträtt</title>
<style>body{margin:0;background:#2b3a55;font-family:sans-serif;color:#fff}.g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:6px}.c{background:linear-gradient(#6b7fa8,#3b4a6b);border-radius:8px;overflow:hidden;position:relative}.c svg{width:100%;height:auto;display:block}.c span{position:absolute;left:6px;top:4px;font-size:11px;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:4px}</style></head>
<body><div class="g" id="g"></div>
<script type="module">
import { characterSVG, EXPRESSIONS, POSES } from '../js/art/character.js';
import { makeRng } from '../js/core/util.js';
import { makePerson } from '../js/sim/people.js';
const q = new URLSearchParams(location.search);
const rnd = makeRng(+(q.get('seed') || 7));
const g = document.getElementById('g');
const mode = q.get('mode') || 'people';
const n = +(q.get('n') || 18);
if (mode === 'people') {
  for (let i = 0; i < n; i++) {
    const p = makePerson(rnd, { gender: i % 2 ? 'k' : 'm' });
    const d = document.createElement('div'); d.className = 'c';
    d.innerHTML = characterSVG(p, { pose: POSES[i % POSES.length], expr: EXPRESSIONS[i % EXPRESSIONS.length], id: 'p' + i }) + `<span>${p.name} ${p.age} · ${p.look.hair} · ${p.look.outfit} · ${p.look.body}</span>`;
    g.append(d);
  }
} else if (mode === 'outfits') {
  const { OUTFITS } = await import('../js/sim/people.js');
  for (const o of OUTFITS) {
    const p = makePerson(rnd, { gender: ['blus', 'klanning', 'drakt_svart', 'drakt_rod', 'drakt_beige'].includes(o.id) ? 'k' : 'm' });
    p.look.outfit = o.id; p.look.jacketColor = o.jacket; p.look.shirtColor = o.shirt; p.look.tieColor = o.tie;
    const d = document.createElement('div'); d.className = 'c';
    d.innerHTML = characterSVG(p, { pose: 'stand', expr: 'neutral', id: 'o' + o.id }) + `<span>${o.name}</span>`;
    g.append(d);
  }
} else if (mode === 'hair') {
  const { HAIR_STYLES } = await import('../js/sim/people.js');
  for (const hs of HAIR_STYLES) {
    const p = makePerson(rnd, { gender: 'k' });
    p.look.hair = hs.id;
    const d = document.createElement('div'); d.className = 'c';
    d.innerHTML = characterSVG(p, { pose: 'stand', expr: 'neutral', crop: 'head', id: 'h' + hs.id }) + `<span>${hs.name}</span>`;
    g.append(d);
  }
} else {
  const p = makePerson(rnd, { gender: q.get('g') || 'm' });
  if (q.get('hair')) p.look.hair = q.get('hair');
  for (const e of EXPRESSIONS) {
    const d = document.createElement('div'); d.className = 'c';
    d.innerHTML = characterSVG(p, { pose: 'stand', expr: e, crop: 'head', id: 'x' + e }) + `<span>${e}</span>`;
    g.append(d);
  }
}
</script></body></html>
